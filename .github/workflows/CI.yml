name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # cancel superseded runs of the same branch / PR
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.julia }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']   # minimum supported (LTS) and latest release
        os: [ubuntu-latest, macos-latest]
    env:
      OMP_NUM_THREADS: 2   # hosted runners have 3-4 vCPUs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      # on macOS deps/build.jl picks the newest Homebrew g++-N, since g++ there is Apple Clang without OpenMP
      - name: Compiler
        run: g++ --version; compgen -c g++- | sort -u
      - uses: julia-actions/julia-buildpkg@v1
      # Pkg.test() currently fails on these runners with "expected package `Test` to be registered" before any test
      # runs (also seen locally with a freshly generated package), so run the test script directly; Test is a stdlib
      # and loads from the default LOAD_PATH.
      - name: Run tests
        run: julia --color=yes --project=. test/runtests.jl
