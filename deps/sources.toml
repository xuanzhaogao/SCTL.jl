# Sources of the header-only libraries compiled into libsctljl, pinned to the commits of the git submodules
# deps/SCTL and deps/pvfmm: our forks of SCTL and pvfmm, branch exact-near-field (ParticleFMM sums the near field from
# the original coordinates, dmalhotra/pvfmm#39). deps/build.jl downloads them from here when the submodules are not
# checked out (e.g. in a `Pkg.develop(url = ...)` clone, which has no submodules). test/runtests.jl checks that the
# commits match the submodules.

